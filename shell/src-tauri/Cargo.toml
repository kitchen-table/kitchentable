[package]
name = "kitchentable-shell"
description = "Kitchen Table desktop shell: window, tray, and the IPC<->socket proxy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kitchen-table/kitchentable"
rust-version = "1.85"

# Deliberately its own workspace root. Tauri needs system WebKit, which the
# Linux CI runner does not have; keeping it out of the root workspace means
# `cargo build --workspace` stays pure Rust and cross-platform. The Tauri build
# runs on macOS only (docs/repo-architecture.md section 6).
[workspace]

[lib]
name = "kitchentable_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kt-types = { version = "0.1.0", path = "../../crates/kt-types" }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
# Launch at login. A LaunchAgent plist written by hand would be the same
# mechanism with our own bugs in it, and this one already knows the difference
# between a bundled app and a development binary.
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
