<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trip Planner</title>
    <style>
      :root {
        --paper: #fbfaf8;
        --raised: #f0ece4;
        --ink: #1a1a1a;
        --ink2: #4a4640;
        --muted: #8a8378;
        --accent: #2f6df0;
        --green: #2f9e6f;
        --line: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #211f19;
          --raised: #2b2822;
          --ink: #f2ede3;
          --ink2: #cdc6ba;
          --muted: #918a7d;
          --accent: #5b8dff;
          --green: #52c08d;
          --line: rgba(255, 255, 255, 0.1);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px 64px;
        background: var(--paper);
        color: var(--ink);
        font: 400 16px/1.5 system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 460px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      .where {
        margin: 0 0 24px;
        font-size: 12.5px;
        color: var(--muted);
      }
      h2 {
        margin: 28px 0 10px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: var(--raised);
        border-radius: 11px;
        margin-bottom: 8px;
      }
      li.done span {
        text-decoration: line-through;
        color: var(--muted);
      }
      li span {
        flex: 1;
        min-width: 0;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        flex: none;
        accent-color: var(--accent);
      }
      .remove {
        border: none;
        background: none;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
      }
      form {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      input[type="text"],
      textarea {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px 13px;
        background: var(--paper);
        color: var(--ink);
        font: 400 15px system-ui, sans-serif;
      }
      textarea {
        width: 100%;
        min-height: 92px;
        resize: vertical;
      }
      button.add {
        border: none;
        border-radius: 10px;
        padding: 0 16px;
        background: var(--accent);
        color: #fff;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
      }
      .note {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .saved {
        color: var(--green);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lisbon Trip</h1>
      <p class="where" id="where">…</p>

      <h2>Packing list</h2>
      <ul id="items"></ul>
      <form id="add">
        <input type="text" id="what" placeholder="Add something" autocomplete="off" />
        <button class="add" type="submit">Add</button>
      </form>

      <h2>My notes</h2>
      <textarea id="notes" placeholder="Only you can see these."></textarea>
      <p class="note" id="notes-state">Saved on this device.</p>
    </main>

    <!--
      The whole storage API. Served by Kitchen Table; absent everywhere else,
      which is why every use of it below is guarded by `kt &&`.
    -->
    <script src="/__kt/storage.js"></script>
    <script>
      // Falls back to plain localStorage when this page is opened from
      // somewhere that is not Kitchen Table, so the app still works.
      const shared = window.kt
        ? kt.storage()
        : {
            get: async (k) => JSON.parse(localStorage.getItem("t/" + k) ?? "null") ?? undefined,
            set: async (k, v) => localStorage.setItem("t/" + k, JSON.stringify(v)),
          };
      const mine = window.kt ? kt.storage({ personal: true }) : shared;

      const list = document.getElementById("items");
      const where = document.getElementById("where");

      let items = [];

      function draw() {
        list.replaceChildren(
          ...items.map((item, index) => {
            const row = document.createElement("li");
            if (item.done) row.className = "done";

            const box = document.createElement("input");
            box.type = "checkbox";
            box.checked = item.done;
            box.addEventListener("change", () => {
              items[index].done = box.checked;
              save();
            });

            const label = document.createElement("span");
            label.textContent = item.what;

            const remove = document.createElement("button");
            remove.className = "remove";
            remove.textContent = "×";
            remove.setAttribute("aria-label", "Remove " + item.what);
            remove.addEventListener("click", () => {
              items.splice(index, 1);
              save();
            });

            row.append(box, label, remove);
            return row;
          }),
        );
      }

      async function save() {
        draw();
        await shared.set("items", items);
      }

      document.getElementById("add").addEventListener("submit", (event) => {
        event.preventDefault();
        const what = document.getElementById("what");
        const text = what.value.trim();
        if (!text) return;
        items.push({ what: text, done: false });
        what.value = "";
        save();
      });

      // Personal, and deliberately so: a shared list with a private margin is
      // the case per-viewer storage exists for.
      const notes = document.getElementById("notes");
      const notesState = document.getElementById("notes-state");
      let pending;
      notes.addEventListener("input", () => {
        clearTimeout(pending);
        notesState.textContent = "Saving…";
        notesState.className = "note";
        pending = setTimeout(async () => {
          await mine.set("notes", notes.value);
          notesState.textContent = "Saved.";
          notesState.className = "note saved";
        }, 400);
      });

      (async () => {
        items = (await shared.get("items")) ?? [
          { what: "Passports", done: false },
          { what: "Sunscreen", done: false },
          { what: "Adapters (x4)", done: false },
        ];
        draw();
        notes.value = (await mine.get("notes")) ?? "";

        // Say plainly where this is kept, because it changes what the list
        // means: one shared list, or a copy per phone.
        if (!window.kt) {
          where.textContent = "kept in this browser";
          return;
        }
        const at = await kt.where();
        where.textContent =
          at.mode === "synced"
            ? "shared — everyone with this link sees the same list"
            : at.backup
              ? "kept on this device, copied to the host machine"
              : "kept on this device only";
      })();
    </script>
  </body>
</html>
