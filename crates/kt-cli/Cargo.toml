[package]
name = "kt-cli"
description = "kt: the Kitchen Table command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The command people type is `kt`; the crate is kt-cli so it sorts with its
# siblings. `kitchentable` is offered as an alias by the installer.
[[bin]]
name = "kt"
path = "src/main.rs"

[dependencies]
kt-types = { version = "0.1.0", path = "../kt-types" }
qrcode = { version = "0.14.1", default-features = false }
serde_json.workspace = true
thiserror.workspace = true
