[package]
name = "kt-daemon"
description = "Kitchen Table daemon: wiring, event bus, supervision entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
bytes = "1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
kt-auth = { version = "0.1.0", path = "../kt-auth" }
kt-certs = { version = "0.1.0", path = "../kt-certs" }
kt-mdns = { version = "0.1.0", path = "../kt-mdns" }
kt-registry = { version = "0.1.0", path = "../kt-registry" }
kt-server = { version = "0.1.0", path = "../kt-server" }
kt-store = { version = "0.1.0", path = "../kt-store" }
kt-tunnel-proto = { version = "0.1.0", path = "../kt-tunnel-proto" }
kt-types = { version = "0.1.0", path = "../kt-types" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# Named directly, only to choose a cryptography provider.
#
# tokio-tungstenite pulls rustls in without selecting one, and rustls 0.23
# refuses to guess at runtime when zero or two are compiled in - it returns an
# error the first time anything opens a TLS connection. Which is the first time
# a daemon dials a real `wss://` edge, in front of a user, after every test has
# passed. See the note in main.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower = { version = "0.5", features = ["util"] }
yamux = "0.14.0"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio-util = { version = "0.7", features = ["compat"] }
kt-auth = { path = "../kt-auth" }
kt-mdns = { path = "../kt-mdns" }
