name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux carries the pure-Rust crates for speed; macOS is the real
        # target and the only place kt-mdns and kt-certs are meaningful.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  shell:
    name: Tauri shell (macOS)
    # src-tauri is its own workspace root and needs system WebKit, so it is
    # not covered by the `rust` job above. macOS only, per repo-architecture
    # section 6.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the UI
        # tauri.conf.json resolves frontendDist to ../ui/dist
        run: pnpm -C shell/ui build
      - name: fmt
        working-directory: shell/src-tauri
        run: cargo fmt --all --check
      - name: clippy
        working-directory: shell/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: probe
        name: Is the UI scaffolded yet?
        run: |
          if [ -f shell/ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::shell/ui is not scaffolded yet - skipping. Activates automatically once checklist D0 lands it."
          fi
      - uses: pnpm/action-setup@v6
        if: steps.probe.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: 20
          cache: pnpm
      - name: install
        if: steps.probe.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: typecheck
        if: steps.probe.outputs.present == 'true'
        run: pnpm -C shell/ui typecheck
      - name: test
        if: steps.probe.outputs.present == 'true'
        run: pnpm -C shell/ui test

  generated-types:
    name: Generated types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: probe
        name: Is type generation wired up yet?
        run: |
          if [ -f shell/ui/package.json ] && [ -d shell/ui/src/generated ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ts-rs generation is not wired up yet - skipping. Activates automatically once checklist D0 lands it."
          fi
      - uses: Swatinem/rust-cache@v2
        if: steps.probe.outputs.present == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.probe.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: 20
          cache: pnpm
      - name: install
        if: steps.probe.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: regenerate
        if: steps.probe.outputs.present == 'true'
        run: cargo test -p kt-types --locked && pnpm -C shell/ui gen:types
      - name: fail if stale
        if: steps.probe.outputs.present == 'true'
        run: |
          if ! git diff --exit-code -- shell/ui/src/generated; then
            echo "::error::Generated TypeScript is out of date. Run 'cargo test -p kt-types && pnpm -C shell/ui gen:types' and commit the result. Never edit shell/ui/src/generated by hand (CLAUDE.md rule 8)."
            exit 1
          fi
